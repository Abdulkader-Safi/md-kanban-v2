[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]
# The M0 spikes stay as reference until M2 to M6 replace them. They are not built by default.
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.1"

# Exact pins. Upgrade gpui-kit only on purpose, in its own commit (build spec, principle 7).
[workspace.dependencies]
gpui-kit = "=0.7.1"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"

[profile.release]
lto = "thin"
strip = true
