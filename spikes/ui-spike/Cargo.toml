[package]
name = "ui-spike"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-rust"] }
ratex-gpui = { version = "=0.4.1", default-features = false }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
