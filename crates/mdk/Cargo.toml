[package]
name = "mdk"
description = "The native MD Kanban: a kanban board over a folder of markdown cards."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
mdk-format = { path = "../mdk-format" }
mdk-markdown = { path = "../mdk-markdown" }
mdk-store = { path = "../mdk-store" }
mdk-vim = { path = "../mdk-vim" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "=6.0.0"
env_logger = { version = "0.11", default-features = false }
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
